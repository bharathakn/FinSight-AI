[project]
name = "finsight"
version = "0.1.0"
description = "FinSight AI — financial transaction intelligence: KDD + pattern mining + ML + cloud microservices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "polars>=1.0",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "xgboost-cpu>=2.1",          # CPU-only wheel (skips ~300 MB of CUDA/NCCL)
    "mlxtend>=0.23",
    "networkx>=3.3",
    "rapidfuzz>=3.9",
    "lxml>=5.2",
    "fsspec>=2024.6",
    "joblib>=1.4",
]

[project.optional-dependencies]
dl = ["torch>=2.3", "onnx>=1.16", "onnxruntime>=1.18"]
explain = ["shap>=0.45"]
viz = ["matplotlib>=3.8", "seaborn>=0.13", "plotly>=5.22", "jupyter>=1.0"]
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic>=2.7", "onnxruntime>=1.18"]
cloud = ["gcsfs>=2024.6", "s3fs>=2024.6"]
dashboard = ["streamlit>=1.36", "plotly>=5.22", "httpx>=0.27"]
dev = ["pytest>=8.2", "locust>=2.29"]

[tool.uv]
# CPU-only PyTorch: the default Linux wheel pulls ~2.5 GB of CUDA libraries we don't need.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
