<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FinSight AI: transaction risk scoring, pattern mining and network analytics on Indian payments (UPI · NEFT · RTGS)" />
    <meta name="theme-color" content="#f4f1e8" />
    <style>html { background: #f4f1e8; } html[data-theme="dark"] { background: #141817; }</style>
    <script>
      // first paint in the right theme (light unless the viewer chose otherwise); see src/theme.ts
      (function () {
        var t = null;
        try { t = localStorage.getItem("finsight-theme"); } catch (e) { /* storage unavailable */ }
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>FinSight AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
