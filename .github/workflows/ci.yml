# Continuous integration: every push / pull request runs the Python tests and builds the dashboard.
# Deployment is GitOps: Render (render.yaml autoDeploy) and Vercel redeploy main on their own.
# Tests that need the private dataset or trained artifacts skip themselves (32 run, 28 skip on a clean runner).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (CPU-only wheels from uv.lock)
        run: uv sync --all-extras --frozen
      - name: Tests
        run: uv run pytest -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check + production build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://finsight-api.onrender.com

  image:
    # Builds the same image Render builds (inprocess gateway), pulling artifacts from the latest release.
    # Runs once a release exists: set the repository variable ARTIFACTS_URL (make publish-artifacts prints it).
    if: ${{ vars.ARTIFACTS_URL != '' }}
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build inprocess image
        run: |
          docker build -f docker/Dockerfile --build-arg SERVICE=gateway --build-arg REQS=full \
            --build-arg ARTIFACTS_URL=${{ vars.ARTIFACTS_URL }} -t finsight-api:ci .
          docker image ls finsight-api:ci
      - name: Smoke test (health + one score, 512 MB limit like Render free)
        run: |
          docker run -d --name api -m 512m -p 8000:8000 finsight-api:ci
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/score-transaction -H 'content-type: application/json' \
            -d '{"transaction_id":"TXN_IND_202608_001768"}' | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['risk_score'], d['tier']); assert d['tier']=='CRITICAL'"
          docker stats --no-stream api
