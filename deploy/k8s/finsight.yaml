# Conceptual Kubernetes manifests (Plan §8.2 "Orchestration"): what the Compose stack becomes on a cluster.
# Not deployed in this project (no free managed cluster), but valid: `kubectl apply --dry-run=client -f`.
# Shows: Deployments (desired replicas), Services (stable DNS + load balancing), Secret (internal key),
# readiness/liveness probes on /health, resource limits, and a HorizontalPodAutoscaler for ml-service.
apiVersion: v1
kind: Secret
metadata: { name: finsight-internal }
type: Opaque
stringData: { FINSIGHT_INTERNAL_KEY: change-me }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ml-service, labels: { app: ml-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: ml-service } }
  template:
    metadata: { labels: { app: ml-service } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: ml
          image: ghcr.io/bharathakn/finsight-ml:latest
          ports: [{ containerPort: 8001 }]
          env:
            - { name: PORT, value: "8001" }
            - name: FINSIGHT_INTERNAL_KEY
              valueFrom: { secretKeyRef: { name: finsight-internal, key: FINSIGHT_INTERNAL_KEY } }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe: { httpGet: { path: /health, port: 8001 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 20, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: ml-service }
spec:
  selector: { app: ml-service }
  ports: [{ port: 8001, targetPort: 8001 }]        # cluster-internal only (ClusterIP)
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ml-service }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ml-service }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, labels: { app: gateway } }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: gateway
          image: ghcr.io/bharathakn/finsight-gateway:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: FINSIGHT_SERVICE_MODE, value: remote }
            - { name: FINSIGHT_ML_URL, value: "http://ml-service:8001" }
            - { name: FINSIGHT_MINING_URL, value: "http://mining-service:8002" }
            - { name: FINSIGHT_GRAPH_URL, value: "http://graph-service:8003" }
            - { name: FINSIGHT_SANCTIONS_URL, value: "http://sanctions-service:8004" }
            - name: FINSIGHT_INTERNAL_KEY
              valueFrom: { secretKeyRef: { name: finsight-internal, key: FINSIGHT_INTERNAL_KEY } }
          resources: { limits: { cpu: "1", memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health, port: 8000 } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  type: LoadBalancer                                # the only public entry point
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8000 }]
# mining-service, graph-service and sanctions-service follow the ml-service pattern (ports 8002–8004).
